<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 486" width="964" height="486" role="img" aria-label="一次教练提问：蓝牙消息和设备状态" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><title>一次教练提问：蓝牙消息和设备状态</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b1fe2b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b0b8"/></marker></defs><rect width="964" height="486" rx="14" fill="#161a1f"/><rect x="210" y="22" width="180" height="40" rx="10" fill="#1d2228" stroke="#4b6a12"/><text x="300" y="48" font-size="13" fill="#b1fe2b" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">设备</text><line x1="300" y1="64" x2="300" y2="470" stroke="#2a3038" stroke-width="2" stroke-dasharray="4 6"/><rect x="670" y="22" width="180" height="40" rx="10" fill="#1d2228" stroke="#2a3038"/><text x="760" y="48" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">手机应用</text><line x1="760" y1="64" x2="760" y2="470" stroke="#2a3038" stroke-width="2" stroke-dasharray="4 6"/><text x="40" y="48" font-size="11" fill="#6f7782" font-weight="400" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">设备状态</text><line x1="306" y1="92" x2="754" y2="92" stroke="#b1fe2b" stroke-width="2" marker-end="url(#ah)"/><text x="530.0" y="84" font-size="13" fill="#e8eaed" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">AGENT_START 0x20</text><text x="530.0" y="109" font-size="11" fill="#6f7782" font-weight="400" text-anchor="middle">长按 OK 达到 500 ms</text><rect x="28" y="78" width="150" height="28" rx="14" fill="#0e1013" stroke="#b1
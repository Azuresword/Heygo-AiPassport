t-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Text to speech</text><rect x="500" y="152" width="210" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="514" y="172" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Run data · reports · turns</text><rect x="500" y="190" width="210" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="514" y="210" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Popups · run start</text><text x="500" y="272" font-size="12" fill="#a9b0b8" font-weight="400" text-anchor="start">All analysis and voice</text><line x1="736" y1="155" x2="786" y2="155" stroke="#a9b0b8" stroke-width="1.5" marker-end="url(#ag)" marker-start="url(#ag)"/><rect x="790" y="110" width="150" height="90" rx="12" fill="#161a1f" stroke="#3a424c" stroke-dasharray="5 5"/><text x="865" y="145" font-size="12" fill="#e8eaed" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">HEYGOAI</text><text x="865" y="170" font-size="12" fill="#a9b0b8" font-weight="400" text-anchor="middle">AI coach answers</text></svg>
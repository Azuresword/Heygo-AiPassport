<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 310" width="964" height="310" role="img" aria-label="System architecture: device, BLE link, phone app, and HeygoAI" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><title>System architecture: device, BLE link, phone app, and HeygoAI</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b1fe2b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b0b8"/></marker></defs><rect width="964" height="310" rx="14" fill="#161a1f"/><rect x="24" y="24" width="270" height="262" rx="12" fill="#1d2228" stroke="#4b6a12"/><text x="44" y="54" font-size="12" fill="#b1fe2b" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">DEVICE</text><text x="44" y="76" font-size="12" fill="#6f7782" font-weight="400" text-anchor="start">ESP32-C3 · 8 MB flash · no PSRAM</text><rect x="44" y="100" width="230" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="58" y="120" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">3 keys · UP / OK / DOWN</text><rect x="44" y="138" width="230" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="58" y="158" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Microphone + speaker · ES8311</text><rect x="44" y="176" width="230" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="58" y="196" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Screen 240×320 · ST7789P3</text><rect x="44" y="214" width="230" height="30" rx="8" fill="#0e1013" stroke="#2a3038"/><text x="58" y="234" font-size="13" fill="#e8eaed" font-weight="400" text-anchor="start">Fuel gauge · CW2017</text><text x="44" y="272" font-size="12" fill="#a
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 380" width="964" height="380" role="img" aria-label="任务、优先级、栈和队列" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><title>任务、优先级、栈和队列</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b1fe2b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b0b8"/></marker></defs><rect width="964" height="380" rx="14" fill="#161a1f"/><text x="24" y="40" font-size="11" fill="#6f7782" font-weight="400" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="1.5">任务</text><rect x="24" y="54" width="520" height="48" rx="10" fill="#1d2228" stroke="#2a3038"/><text x="42" y="84" font-size="15" fill="#b1fe2b" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">voice</text><text x="170" y="84" font-size="12.5" fill="#a9b0b8" font-weight="400" text-anchor="start">录音编码、喂给喇叭</text><text x="452" y="74" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">优先级</text><text x="452" y="91" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">7</text><text x="526" y="74" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">栈</text><text x="526" y="91" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">4,096</text><rect x="24" y="112" width="520" height="48" rx="10" fill="#1d2228" stroke="#2a3038"/><text x="42" y="142" font-size="15" fill="#b1fe2b" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">ble_tx</text><text x="170" y="142" font-size="12.5" fill="#a9b0b8" font-weight="400" text-anchor="start">优先发送控制队列</text><text x="452" y="132" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">优先级</text><text x="452" y="149" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">6</text><text x="526" y="132" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">栈</text><text x="526" y="149" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">3,072</text><rect x="24" y="170" width="520" height="48" rx="10" fill="#1d2228" stroke="#2a3038"/><text x="42" y="200" font-size="15" fill="#b1fe2b" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">coach</text><text x="170" y="200" font-size="12.5" fill="#a9b0b8" font-weight="400" text-anchor="start">状态机，一次处理一个事件</text><text x="452" y="190" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">优先级</text><text x="452" y="207" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">5</text><text x="526" y="190" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">栈</text><text x="526" y="207" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">4,096</text><rect x="24" y="228" width="520" height="48" rx="10" fill="#1d2228" stroke="#2a3038"/><text x="42" y="258" font-size="15" fill="#b1fe2b" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">LVGL</text><text x="170" y="258" font-size="12.5" fill="#a9b0b8" font-weight="400" text-anchor="start">esp_lvgl_port，5 ms 节拍</text><text x="452" y="248" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">优先级</text><text x="452" y="265" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">4</text><text x="526" y="248" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">栈</text><text x="526" y="265" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">7,168</text><rect x="24" y="286" width="520" height="48" rx="10" fill="#0e1013" stroke="#2a3038"/><text x="42" y="316" font-size="15" fill="#a9b0b8" font-weight="700" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">NimBLE host</text><text x="170" y="316" font-size="12.5" fill="#a9b0b8" font-weight="400" text-anchor="start">GATT、连接、接收回调</text><text x="452" y="306" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">优先级</text><text x="452" y="323" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">IDF</text><text x="526" y="306" font-size="10" fill="#6f7782" font-weight="400" text-anchor="end">栈</text><text x="526" y="323" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">4,096</text><text x="576" y="40" font-size="11" fill="#6f7782" font-weight="400" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace" letter-spacing="1.5">队列</text><rect x="576" y="54" width="364" height="60" rx="10" fill="#0e1013" stroke="#2a3038"/><text x="594" y="79" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">coach 队列</text><text x="922" y="79" font-size="13" fill="#b1fe2b" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">16 条消息</text><text x="594" y="100" font-size="12" fill="#6f7782" font-weight="400" text-anchor="start">按键 · 计时器 · 链路事件</text><rect x="576" y="126" width="364" height="60" rx="10" fill="#0e1013" stroke="#2a3038"/><text x="594" y="151" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">控制发送</text><text x="922" y="151" font-size="13" fill="#b1fe2b" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">8 个包</text><text x="594" y="172" font-size="12" fill="#6f7782" font-weight="400" text-anchor="start">队列满时丢弃新包</text><rect x="576" y="198" width="364" height="60" rx="10" fill="#0e1013" stroke="#2a3038"/><text x="594" y="223" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">音频发送</text><text x="922" y="223" font-size="13" fill="#b1fe2b" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">8 个包</text><text x="594" y="244" font-size="12" fill="#6f7782" font-weight="400" text-anchor="start">丢最旧包，AGENT_END 排在音频后</text><rect x="576" y="270" width="364" height="60" rx="10" fill="#0e1013" stroke="#2a3038"/><text x="594" y="295" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">音频下行</text><text x="922" y="295" font-size="13" fill="#b1fe2b" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">8 × 164 字节</text><text x="594" y="316" font-size="12" fill="#6f7782" font-weight="400" text-anchor="start">满了丢最旧的</text><text x="24" y="362" font-size="11.5" fill="#6f7782" font-weight="400" text-anchor="start">数字越大优先级越高。栈的单位是字节。</text></svg>